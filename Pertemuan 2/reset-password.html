<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card p-4 shadow" style="max-width: 500px;">
            <div class="text-center mb-4">
                <img src="assets/logo_unscollab.png" alt="UNSCollab Logo" style="width: 150px;">
                <h3 class="mt-3" style="color: white;">UNSCollab</h3>
            </div>

            <div id="formSection">
                <!-- Alert Notification -->
                <div id="alertContainer"></div>

                <h4 class="mb-4 text-center" style="color: white;">Reset Password</h4>
                
                <div class="input-group mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Password Baru">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password')">
                        <i id="passwordToggleIcon" class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="input-group mb-4">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Konfirmasi Password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirmPassword')">
                        <i id="confirmPasswordToggleIcon" class="bi bi-eye"></i>
                    </button>
                </div>

                <button id="resetBtn" class="btn btn-info text-white w-100 mb-3">Reset Password</button>
                <p class="text-center" style="color: white;">
                    Kembali ke <a href="index.html" class="text-info text-decoration-none">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Check token dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const type = urlParams.get('type');

        if (!token || !type) {
            showNotification('Link reset password tidak valid.', 'danger');
            document.getElementById('resetBtn').disabled = true;
        }

        document.getElementById('resetBtn').addEventListener('click', async function() {
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const errors = [];

            if (!password) {
                errors.push('Password tidak boleh kosong');
            } else if (password.length < 6) {
                errors.push('Password minimal 6 karakter');
            }

            if (!confirmPassword) {
                errors.push('Konfirmasi password tidak boleh kosong');
            } else if (password !== confirmPassword) {
                errors.push('Password dan konfirmasi password tidak cocok');
            }

            if (errors.length > 0) {
                showNotification(errors.join(' | '), 'danger');
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            const originalText = resetBtn.textContent;
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Loading...';

            try {
                const response = await fetch('reset-password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password,
                        confirmPassword: confirmPassword,
                        type: type
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    if (data.errors && Array.isArray(data.errors)) {
                        showNotification(data.errors.join(' | '), 'danger');
                    } else {
                        showNotification(data.message, 'danger');
                    }
                }
            } catch (error) {
                showNotification('Terjadi kesalahan. Silakan coba lagi.', 'danger');
                console.error('Error:', error);
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = originalText;
            }
        });

        // Allow Enter key
        [document.getElementById('password'), document.getElementById('confirmPassword')].forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('resetBtn').click();
                }
            });
        });
    </script>
</body>
</html>
