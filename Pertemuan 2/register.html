<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card p-4 shadow">
            <div class="row" style="gap: 20px;">
                <div class="col" id="imageSection">
                    <img src="assets/logo_unscollab.png" alt="UNSCollab Logo" style="width: 250px;">
                    <div class="card-body">
                        <h3 class="card-title text-center" style="color: white;">UNSCollab</h3>
                        <p class="card-text text-center" style="color: white;">Bridging industry and campus collaboration</p>
                    </div>
                </div>
                <div class="col p-4">
                    <div id="formSection">
                        <!-- Alert Notification -->
                        <div id="alertContainer"></div>

                        <h3 class="mb-3" style="color: white;">Register Company</h3>
                        <input type="text" id="name" class="form-control mb-3" placeholder="Company Name">
                        <input type="email" id="email" class="form-control mb-3" placeholder="Email">
                        
                        <div class="input-group mb-3">
                            <input type="password" id="password" class="form-control" placeholder="Password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" onclick="togglePasswordVisibility('password')">
                                <i id="passwordToggleIcon" class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div class="input-group mb-4">
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword" onclick="togglePasswordVisibility('confirmPassword')">
                                <i id="confirmPasswordToggleIcon" class="bi bi-eye"></i>
                            </button>
                        </div>

                        <button id="signupBtn" class="btn btn-info text-white w-100 mb-5">Sign Up</button>
                        <p id="loginText" class="text-center" style="color: white;">
                            Already have an account? <a href="index.html" class="text-info text-decoration-none">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
