<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card p-4 shadow">
            <div class="row">
                <div class="col" id="imageSection">
                    <img src="assets/logo_unscollab.png" alt="UNSCollab Logo" style="width: 250px;">
                    <div class="card-body">
                        <h3 class="card-title text-center" style="color: white;">UNSCollab</h3>
                        <p class="card-text text-center" style="color: white;">Bridging industry and campus collaboration</p>
                    </div>
                </div>
                <div class="col p-4">
                    <div id="formSection">
                        <div class="d-flex mb-5" style="gap: 10px;">
                            <button id="companyBtn" class="btn btn-info text-white w-100 mb-2" onclick="setMode('company')">Company</button>
                            <button id="adminBtn" class="btn btn-light w-100 mb-2" onclick="setMode('admin')">Admin</button>
                        </div>
                        <h3 id="titleLogin" class="mb-3" style="color: white;"></h3>
                        <input type="text" id="email" class="form-control mb-3" placeholder="Email">
                        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                        <div class="mb-3 text-end" id="forgotPassword">
                            <a href="#" class="text-info text-decoration-none small">Forgot Password?</a>
                        </div>
                        <button id="loginBtn" class="btn btn-info text-white w-100 mb-5">Login</button>
                        <p id="registerText" class="text-center" style="color: white;">
                            Don't have an account? <a href="register.html" class="text-info text-decoration-none">Register here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
